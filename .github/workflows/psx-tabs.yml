name: PSX Tabs
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "APK download URL (direct .apk link)"
        required: true
        default: "https://github.com/asifweb005/dscm-android-test/releases/download/psx-v1/app-release.apk"
        type: string
permissions:
  contents: read
jobs:
  psx-session:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install PSX Analyze, enter name AXF if asked, capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            mkdir -p output
            adb wait-for-device
            for i in $(seq 1 30); do
              if adb shell getprop sys.boot_completed 2>/dev/null | grep -q 1; then
                echo "boot completed after $i checks"
                break
              fi
              sleep 5
            done
            adb shell settings put global window_animation_scale 0 || true
            adb shell settings put global transition_animation_scale 0 || true
            adb shell settings put global animator_duration_scale 0 || true
            adb devices
            adb shell getprop ro.build.version.release
            adb exec-out screencap -p > output/01-home.png
            adb shell uiautomator dump /sdcard/dump1.xml
            adb pull /sdcard/dump1.xml output/dump1.xml
            APK_URL="${{ inputs.apk_url }}"
            echo "Downloading $APK_URL"
            curl -L "$APK_URL" -o app.apk
            ls -lh app.apk
            adb install -r app.apk 2>&1 | tee output/install.log
            adb shell monkey -p com.paradox.psxanalyze -c android.intent.category.LAUNCHER 1
            sleep 20
            adb exec-out screencap -p > output/02-first.png
            adb shell uiautomator dump /sdcard/dump1.xml
            adb pull /sdcard/dump1.xml output/dump1.xml
            python3 -c 'import re,os,subprocess,time; xml=open("output/dump1.xml").read(); m=re.search(r"class=.android.widget.EditText. *?bounds=.\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\].", xml); print("edittext match:", bool(m)); [subprocess.run(["adb","shell","input","tap",str((int(m.group(1))+int(m.group(3)))//2),str((int(m.group(2))+int(m.group(4)))//2)]), time.sleep(2), subprocess.run(["adb","shell","input","text","AXF"]), time.sleep(2)] if m else None; print("done")'
            adb shell input keyevent 66
            sleep 3
            adb exec-out screencap -p > output/03-name-entered.png
            adb shell uiautomator dump /sdcard/dump1.xml
            adb pull /sdcard/dump1.xml output/dump1.xml
            sleep 3
            adb shell input tap 540 1900
            sleep 3
            adb exec-out screencap -p > output/04-after-name.png
            adb shell uiautomator dump /sdcard/dump1.xml
            adb pull /sdcard/dump1.xml output/dump1.xml
            adb shell input tap 540 1200
            sleep 3
            adb exec-out screencap -p > output/05-final.png
            adb shell uiautomator dump /sdcard/dump1.xml
            adb pull /sdcard/dump1.xml output/dump1.xml
            adb shell dumpsys window windows | grep -E 'mCurrentFocus|mFocusedApp' > output/focus.txt || true
            adb shell dumpsys package com.paradox.psxanalyze > output/package.txt || true
            adb logcat -d > output/logcat.txt || true
            ls -la output
            # --- PSX Tabs capture (app still open on Market home) ---
            adb shell "dumpsys window windows | grep -E 'mCurrentFocus|mFocusedApp'" > output/focus.txt || true
            adb shell monkey -p com.paradox.psxanalyze -c android.intent.category.LAUNCHER 1 || true
            sleep 3
            # Stocks tab
            adb shell input tap 324 2150
            sleep 4
            adb exec-out screencap -p > output/tab-stocks-1.png || true
            adb shell uiautomator dump /sdcard/tab-stocks-1.xml || true
            adb pull /sdcard/tab-stocks-1.xml output/ || true
            adb shell input swipe 540 1400 540 400 500
            sleep 2
            adb exec-out screencap -p > output/tab-stocks-2.png || true
            adb shell uiautomator dump /sdcard/tab-stocks-2.xml || true
            adb pull /sdcard/tab-stocks-2.xml output/ || true
            adb shell input swipe 540 1400 540 400 500
            sleep 2
            adb exec-out screencap -p > output/tab-stocks-3.png || true
            adb shell uiautomator dump /sdcard/tab-stocks-3.xml || true
            adb pull /sdcard/tab-stocks-3.xml output/ || true
            adb shell input swipe 540 1400 540 400 500
            sleep 2
            adb exec-out screencap -p > output/tab-stocks-4.png || true
            adb shell uiautomator dump /sdcard/tab-stocks-4.xml || true
            adb pull /sdcard/tab-stocks-4.xml output/ || true
            adb shell input swipe 540 1400 540 400 500
            sleep 2
            adb exec-out screencap -p > output/tab-stocks-5.png || true
            adb shell uiautomator dump /sdcard/tab-stocks-5.xml || true
            adb pull /sdcard/tab-stocks-5.xml output/ || true
            # Portfolio tab
            adb shell input tap 540 2150
            sleep 4
            adb exec-out screencap -p > output/tab-portfolio-1.png || true
            adb shell uiautomator dump /sdcard/tab-portfolio-1.xml || true
            adb pull /sdcard/tab-portfolio-1.xml output/ || true
            adb shell input swipe 540 1400 540 400 500
            sleep 2
            adb exec-out screencap -p > output/tab-portfolio-2.png || true
            adb shell uiautomator dump /sdcard/tab-portfolio-2.xml || true
            adb pull /sdcard/tab-portfolio-2.xml output/ || true
            adb shell input swipe 540 1400 540 400 500
            sleep 2
            adb exec-out screencap -p > output/tab-portfolio-3.png || true
            adb shell uiautomator dump /sdcard/tab-portfolio-3.xml || true
            adb pull /sdcard/tab-portfolio-3.xml output/ || true
            adb shell input swipe 540 1400 540 400 500
            sleep 2
            adb exec-out screencap -p > output/tab-portfolio-4.png || true
            adb shell uiautomator dump /sdcard/tab-portfolio-4.xml || true
            adb pull /sdcard/tab-portfolio-4.xml output/ || true
            adb shell input swipe 540 1400 540 400 500
            sleep 2
            adb exec-out screencap -p > output/tab-portfolio-5.png || true
            adb shell uiautomator dump /sdcard/tab-portfolio-5.xml || true
            adb pull /sdcard/tab-portfolio-5.xml output/ || true
            # Events tab
            adb shell input tap 756 2150
            sleep 4
            adb exec-out screencap -p > output/tab-events-1.png || true
            adb shell uiautomator dump /sdcard/tab-events-1.xml || true
            adb pull /sdcard/tab-events-1.xml output/ || true
            adb shell input swipe 540 1400 540 400 500
            sleep 2
            adb exec-out screencap -p > output/tab-events-2.png || true
            adb shell uiautomator dump /sdcard/tab-events-2.xml || true
            adb pull /sdcard/tab-events-2.xml output/ || true
            adb shell input swipe 540 1400 540 400 500
            sleep 2
            adb exec-out screencap -p > output/tab-events-3.png || true
            adb shell uiautomator dump /sdcard/tab-events-3.xml || true
            adb pull /sdcard/tab-events-3.xml output/ || true
            adb shell input swipe 540 1400 540 400 500
            sleep 2
            adb exec-out screencap -p > output/tab-events-4.png || true
            adb shell uiautomator dump /sdcard/tab-events-4.xml || true
            adb pull /sdcard/tab-events-4.xml output/ || true
            adb shell input swipe 540 1400 540 400 500
            sleep 2
            adb exec-out screencap -p > output/tab-events-5.png || true
            adb shell uiautomator dump /sdcard/tab-events-5.xml || true
            adb pull /sdcard/tab-events-5.xml output/ || true
            # News tab
            adb shell input tap 972 2150
            sleep 4
            adb exec-out screencap -p > output/tab-news-1.png || true
            adb shell uiautomator dump /sdcard/tab-news-1.xml || true
            adb pull /sdcard/tab-news-1.xml output/ || true
            adb shell input swipe 540 1400 540 400 500
            sleep 2
            adb exec-out screencap -p > output/tab-news-2.png || true
            adb shell uiautomator dump /sdcard/tab-news-2.xml || true
            adb pull /sdcard/tab-news-2.xml output/ || true
            adb shell input swipe 540 1400 540 400 500
            sleep 2
            adb exec-out screencap -p > output/tab-news-3.png || true
            adb shell uiautomator dump /sdcard/tab-news-3.xml || true
            adb pull /sdcard/tab-news-3.xml output/ || true
            adb shell input swipe 540 1400 540 400 500
            sleep 2
            adb exec-out screencap -p > output/tab-news-4.png || true
            adb shell uiautomator dump /sdcard/tab-news-4.xml || true
            adb pull /sdcard/tab-news-4.xml output/ || true
            adb shell input swipe 540 1400 540 400 500
            sleep 2
            adb exec-out screencap -p > output/tab-news-5.png || true
            adb shell uiautomator dump /sdcard/tab-news-5.xml || true
            adb pull /sdcard/tab-news-5.xml output/ || true
            ls -la output
      - name: Upload PSX tabs output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psx-tabs-output
          path: output/
          if-no-files-found: warn
