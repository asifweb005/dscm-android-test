name: Android Session

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct download URL of the APK to install (leave empty for a boot-only test)"
        required: false
        default: ""
      package:
        description: "App package to launch after install"
        required: false
        default: "com.paradox.dscm"
      wait_seconds:
        description: "Seconds to wait after launching the app before screenshots"
        required: false
        default: "20"

jobs:
  android-session:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, install APK, capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_URL: ${{ inputs.apk_url }}
          PKG: ${{ inputs.package }}
          WAIT_SECONDS: ${{ inputs.wait_seconds }}
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            mkdir -p output
            adb devices
            adb exec-out screencap -p > output/01-home.png
            if [ -n "$APK_URL" ]; then curl -L "$APK_URL" -o app.apk; adb install -r app.apk; fi
            if [ -n "$APK_URL" ]; then adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 || true; fi
            if [ -n "$APK_URL" ]; then sleep "$WAIT_SECONDS"; fi
            if [ -n "$APK_URL" ]; then adb exec-out screencap -p > output/02-app.png; fi
            if [ -n "$APK_URL" ]; then adb shell uiautomator dump /sdcard/window_dump.xml || true; fi
            if [ -n "$APK_URL" ]; then adb pull /sdcard/window_dump.xml output/window_dump.xml || true; fi
            adb logcat -d > output/logcat.txt || true
            ls -la output

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-session-output
          path: output/
          if-no-files-found: warn
