name: Play Store Install

on:
  workflow_dispatch:
    inputs:
      google_email:
        description: "Google account email to sign in to the Play Store"
        required: true
      package:
        description: "Play Store package id to install"
        required: false
        default: "com.paradox.dscm"

jobs:
  playstore-install:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Play Store emulator, sign in, install app from Play
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GOOGLE_EMAIL: ${{ inputs.google_email }}
          GOOGLE_PASSWORD: ${{ secrets.PLAY_GOOGLE_PASSWORD }}
          PKG: ${{ inputs.package }}
        with:
          api-level: 30
          target: google_apis_playstore
          arch: x86_64
          profile: pixel
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 scripts/playstore_install.py

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playstore-install-output
          path: output/
          if-no-files-found: warn
