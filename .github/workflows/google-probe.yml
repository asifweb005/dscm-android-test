name: Google Probe

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "APK download URL"
        required: false
        default: "https://github.com/asifweb005/dscm-android-test/releases/download/apk-v2/app-release.apk"

jobs:
  google-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install app, tap Continue with Google, capture screens
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_URL: ${{ inputs.apk_url }}
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            mkdir -p output
            curl -L "$APK_URL" -o app.apk
            adb install -r app.apk
            adb shell monkey -p com.paradox.dscm -c android.intent.category.LAUNCHER 1 || true
            sleep 20
            adb exec-out screencap -p > output/02-welcome.png
            adb shell uiautomator dump /sdcard/dump1.xml || true
            adb pull /sdcard/dump1.xml output/dump1.xml || true
            python3 -c 'import re,os; xml=open("output/dump1.xml").read(); m=re.search(r"content-desc=.Continue with Google.[^>]*bounds=.(\d+),(\d+).{2}(\d+),(\d+).", xml); x=(int(m.group(1))+int(m.group(3)))//2 if m else 540; y=(int(m.group(2))+int(m.group(4)))//2 if m else 1154; print("TAP", x, y); os.system("adb shell input tap %d %d" % (x, y))' || true
            sleep 10
            adb exec-out screencap -p > output/03-after-google-tap.png
            adb shell uiautomator dump /sdcard/dump2.xml || true
            adb pull /sdcard/dump2.xml output/dump2.xml || true
            sleep 25
            adb exec-out screencap -p > output/04-later.png
            adb shell uiautomator dump /sdcard/dump3.xml || true
            adb pull /sdcard/dump3.xml output/dump3.xml || true
            adb shell input tap 539 1705
            sleep 8
            adb exec-out screencap -p > output/05-after-chrome-accept.png
            adb shell uiautomator dump /sdcard/dump4.xml || true
            adb pull /sdcard/dump4.xml output/dump4.xml || true
            sleep 15
            adb exec-out screencap -p > output/06-next.png
            adb shell uiautomator dump /sdcard/dump5.xml || true
            adb pull /sdcard/dump5.xml output/dump5.xml || true
            adb shell input tap 161 1689
            sleep 10
            adb exec-out screencap -p > output/07-after-nothanks.png
            adb shell uiautomator dump /sdcard/dump6.xml || true
            adb pull /sdcard/dump6.xml output/dump6.xml || true
            sleep 20
            adb exec-out screencap -p > output/08-signin.png
            adb shell uiautomator dump /sdcard/dump7.xml || true
            adb pull /sdcard/dump7.xml output/dump7.xml || true
            adb shell dumpsys account > output/accounts.txt || true
            adb logcat -d > output/logcat.txt || true
            ls -la output

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-probe-output
          path: output/
          if-no-files-found: warn
