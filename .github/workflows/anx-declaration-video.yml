name: ANX Declaration Video
on:
  workflow_dispatch:
jobs:
  anx-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Record ANX Player permission + playback video (no AI)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_URL: "https://drive.usercontent.google.com/download?id=1DI5ZsfdRhhxwxhOvChKazQJ7ENYvsSuT&export=download&confirm=t"
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 scripts/anx_video.py
      - name: Upload video, screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anx-declaration-video
          path: output/
          if-no-files-found: warn
