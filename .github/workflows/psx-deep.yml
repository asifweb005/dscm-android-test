name: PSX Deep Scroll

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'APK URL'
        required: false
        default: 'https://github.com/asifweb005/dscm-android-test/releases/download/psx-v1/app-release.apk'

jobs:
  psx-session:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses

      - name: Download APK
        run: |
          mkdir -p output
          curl -L -o app-release.apk "${{ inputs.apk_url }}"
          ls -lh app-release.apk
          file app-release.apk || true

      - name: Run PSX session on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb wait-for-device
            for i in $(seq 1 30); do B=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r'); echo "boot check $i: $B"; if [ "$B" = "1" ]; then break; fi; sleep 5; done
            adb install -r app-release.apk
            adb shell monkey -p com.example.psxapp -c android.intent.category.LAUNCHER 1 || true
            sleep 5
            adb shell uiautomator dump /sdcard/dump1.xml || true
            adb pull /sdcard/dump1.xml output/dump1.xml || true
            python3 -c 'import re,os,subprocess,time; xml=open("output/dump1.xml").read(); m=re.search(r"class=.android.widget.EditText.[^>]*bounds=.\[(\d+),(\d+)\]\[(\d+),(\d+)\].", xml); print("NAME_FIELD" if m else "NO_NAME_FIELD"); subprocess.run(["adb","shell","input","tap",str((int(m.group(1))+int(m.group(3)))//2),str((int(m.group(2))+int(m.group(4)))//2)]) if m else None; time.sleep(1); subprocess.run(["adb","shell","input","text","AXF"]) if m else None' || true
            sleep 2
            adb shell uiautomator dump /sdcard/dump2.xml || true
            adb pull /sdcard/dump2.xml output/dump2.xml || true
            python3 -c 'import re,os; xml=open("output/dump2.xml").read(); ms=[re.search(r"(?:text|content-desc)=."+p+r".[^>]*bounds=.\[(\d+),(\d+)\]\[(\d+),(\d+)\].", xml) for p in ["Continue","Get Started","Start","Done","OK","Next","Create","Save","Enter","Proceed","Confirm"]]; m=next((x for x in ms if x and int(x.group(3))>int(x.group(1)) and int(x.group(4))>int(x.group(2))), None); print("CONFIRM_TAP" if m else "NO_CONFIRM"); os.system("adb shell input tap %d %d" % ((int(m.group(1))+int(m.group(3)))//2,(int(m.group(2))+int(m.group(4)))//2)) if m else None' || true
            sleep 3
            adb shell uiautomator dump /sdcard/dump3.xml || true
            adb pull /sdcard/dump3.xml output/dump3.xml || true
            python3 -c 'import re,os; xml=open("output/dump3.xml").read(); m=re.search(r"content-desc=.Decline.[^>]*bounds=.\[(\d+),(\d+)\]\[(\d+),(\d+)\].", xml) if "Allow notifications" in xml else None; print("NOTIF_DECLINED" if m else "NO_NOTIF"); os.system("adb shell input tap %d %d" % ((int(m.group(1))+int(m.group(3)))//2,(int(m.group(2))+int(m.group(4)))//2)) if m else None' || true
            sleep 2
            adb shell uiautomator dump /sdcard/dump4.xml || true
            adb pull /sdcard/dump4.xml output/dump4.xml || true
            adb shell input tap 540 2050 || true
            sleep 3
            adb exec-out screencap -p > output/05-final.png || true
            adb shell uiautomator dump /sdcard/dump5.xml || true
            adb pull /sdcard/dump5.xml output/dump5.xml || true
            adb shell dumpsys package com.example.psxapp > output/package.txt || true
            adb logcat -d > output/logcat.txt || true
            ls -la output
            adb shell input swipe 540 1400 540 400 500
            sleep 2
            adb exec-out screencap -p > output/deep-1.png
            adb shell uiautomator dump /sdcard/deep-1.xml
            adb pull /sdcard/deep-1.xml output/
            adb shell input swipe 540 1400 540 400 500
            sleep 2
            adb exec-out screencap -p > output/deep-2.png
