name: Android Session Long

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct download URL of the APK to install"
        required: false
        default: "https://drive.usercontent.google.com/download?id=1o2HoccOnVGcZDIzK0F1C9An7WxmmZGhZ&export=download&confirm=t"
      package:
        description: "App package to launch after install"
        required: false
        default: "com.paradox.dscm"
      session_minutes:
        description: "How long to keep the emulator + app running (default 300 = 5 hours)"
        required: false
        default: "300"
      check_every_minutes:
        description: "Minutes between alive-checks + screenshots during the session"
        required: false
        default: "10"

jobs:
  android-session-long:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, install APK, guest login, long session
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_URL: ${{ inputs.apk_url }}
          PKG: ${{ inputs.package }}
          SESSION_MINUTES: ${{ inputs.session_minutes }}
          CHECK_EVERY: ${{ inputs.check_every_minutes }}
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            mkdir -p output
            echo "SESSION_MINUTES=$SESSION_MINUTES CHECK_EVERY=$CHECK_EVERY START=$(date -u +%FT%TZ)" | tee output/session-log.txt
            curl -L "$APK_URL" -o app.apk
            ls -l app.apk | tee output/install.txt
            adb install -r app.apk 2>&1 | tee -a output/install.txt
            adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 || true
            sleep 30
            adb exec-out screencap -p > output/02-app.png
            adb shell uiautomator dump /sdcard/dump_tap.xml || true
            adb pull /sdcard/dump_tap.xml output/dump_last.xml || true
            python3 -c "
            import re,os,subprocess
            xml=open('output/dump_last.xml').read() if os.path.exists('output/dump_last.xml') else ''
            m=re.search(r'(?:content-desc|text)=\"[^\"]*Continue as guest[^\"]*\"[^>]*bounds=\"\[(\d+),(\d+)\]\[(\d+),(\d+)\]\"', xml)
            if m:
                x=(int(m.group(1))+int(m.group(3)))//2; y=(int(m.group(2))+int(m.group(4)))//2; src='label'
            else:
                size=subprocess.check_output(['adb','shell','wm','size']).decode()
                mm=re.search(r'(\d+)x(\d+)', size); w=int(mm.group(1)); h=int(mm.group(2))
                x=w//2; y=int(h*0.71); src='fallback'
            print('TAP Continue as guest', x, y, src)
            os.system('adb shell input tap %d %d' % (x,y))
            " | tee -a output/session-log.txt
            sleep 10
            adb exec-out screencap -p > output/03-after-guest.png
            START=$(date +%s)
            END=$((START + SESSION_MINUTES * 60))
            I=0
            while [ "$(date +%s)" -lt "$END" ]; do
              sleep $((CHECK_EVERY * 60))
              I=$((I + 1))
              TS=$(date -u +%FT%TZ)
              if adb shell pidof "$PKG" > /dev/null 2>&1; then
                echo "check $I $TS ALIVE" | tee -a output/session-log.txt
              else
                echo "check $I $TS DEAD - relaunching" | tee -a output/session-log.txt
                adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 || true
                sleep 15
              fi
              adb exec-out screencap -p > "output/soak-$(printf %02d $I).png" || true
            done
            echo "SESSION DONE $(date -u +%FT%TZ) checks=$I" | tee -a output/session-log.txt
            adb logcat -d > output/logcat.txt || true
            ls -la output

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-session-long-output
          path: output/
          if-no-files-found: warn
