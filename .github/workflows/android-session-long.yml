name: Android Session Long

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct download URL of the APK to install"
        required: false
        default: "https://drive.usercontent.google.com/download?id=1o2HoccOnVGcZDIzK0F1C9An7WxmmZGhZ&export=download&confirm=t"
      package:
        description: "App package to launch after install"
        required: false
        default: "com.paradox.dscm"
      session_minutes:
        description: "How long to keep the emulator + app running (default 300 = 5 hours)"
        required: false
        default: "300"
      check_every_minutes:
        description: "Minutes between alive-checks + screenshots during the session"
        required: false
        default: "10"

jobs:
  android-session-long:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, install APK, guest login, long session
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_URL: ${{ inputs.apk_url }}
          PKG: ${{ inputs.package }}
          SESSION_MINUTES: ${{ inputs.session_minutes }}
          CHECK_EVERY: ${{ inputs.check_every_minutes }}
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 scripts/session_long.py

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-session-long-output
          path: output/
          if-no-files-found: warn
